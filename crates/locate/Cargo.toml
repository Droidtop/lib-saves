[package]
name = "saves-locate"
description = "Where a game keeps its saves on a computer (the person's entries, Ludusavi's data, Wine and Proton prefixes) and the copies of them kept there"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "droidtop_agent_saves"
path = "src/lib.rs"

[dependencies]
droidtop-agent-core = { package = "sync-core", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.2" }
# lib-games ci/title-key-870 688f6ad, games-scan 0.3.0 (Droidtop/tracker#871, #870): Epic catalog ids, title2 keys,
# Found::new. Becomes tag = "v0.3.0" once lib-games releases it.
droidtop-agent-scan = { package = "games-scan", git = "https://github.com/Droidtop/lib-games", rev = "688f6adf382e291457e007e3d8caf7f9c8f34134" }
droidtop-agent-store = { package = "sync-store", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.2" }
serde.workspace = true
serde_json.workspace = true
# The Ludusavi manifest is YAML; it is read once when it is updated and kept
# as a compact JSON index after that.
serde_yaml.workspace = true
# Fetches the Ludusavi manifest when the person asks for it or a save lookup
# needs it.
ureq.workspace = true
dirs.workspace = true
# Ren'Py's compiled scripts are zlib streams (engines.rs).
flate2.workspace = true
